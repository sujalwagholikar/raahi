[package]
name = "freshcart"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
vercel_runtime = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1"] }

[[bin]]
name = "health"
path = "api/health.rs"

[[bin]]
name = "products"
path = "api/products.rs"

[[bin]]
name = "orders"
path = "api/orders.rs"

[[bin]]
name = "admin-orders"
path = "api/admin/orders.rs"

[[bin]]
name = "admin-products"
path = "api/admin/products.rs"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
